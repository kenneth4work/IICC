<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 54" fill="none">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8"/>
      <stop offset="35%" stop-color="#DFC184"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B3B"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#DFC184"/>
    </linearGradient>
    <linearGradient id="crestShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211A"/>
      <stop offset="100%" stop-color="#14120E"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon Section -->
  <g transform="translate(4, 3)">
    <!-- Outer Shield with Gold Border -->
    <path d="M24 1 L42 7 V25 C42 36 24 45 24 47 C24 47 6 36 6 25 V7 L24 1 Z" 
          fill="url(#crestShield)" stroke="url(#goldLinear)" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Inner Laurel Wreath / Botanical Leaves -->
    <!-- Left Branch -->
    <path d="M14 28 C13 24 14 20 17 17 C16 19 16 22 17 25" stroke="url(#goldLinear)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M12 22 C10 20 11 17 14 16" stroke="url(#goldLinear)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M15 15 C13 13 14 10 18 10" stroke="url(#goldLinear)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Right Branch -->
    <path d="M34 28 C35 24 34 20 31 17 C32 19 32 22 31 25" stroke="url(#goldLinear)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M36 22 C38 20 37 17 34 16" stroke="url(#goldLinear)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M33 15 C35 13 34 10 30 10" stroke="url(#goldLinear)" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Central Diamond / Star / Torch Motif -->
    <polygon points="24,10 26.5,15 32,15 27.5,18.5 29,24 24,20.5 19,24 20.5,18.5 16,15 21.5,15" 
             fill="url(#goldLinear)" opacity="0.95"/>

    <!-- Monogram IICC in Crest -->
    <text x="24" y="36" 
          text-anchor="middle" 
          fill="url(#goldLight)" 
          font-family="'Cormorant Garamond', 'Times New Roman', serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="0.1em">
      IICC
    </text>

    <!-- Sub-Ribbon Accent -->
    <path d="M16 40 Q24 43 32 40" stroke="url(#goldLinear)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Divider Line -->
  <line x1="58" y1="10" x2="58" y2="44" stroke="url(#goldLinear)" stroke-width="0.8" opacity="0.4"/>

  <!-- Typography: Integrated Brand Text as "Satu Kesatuan" -->
  <g transform="translate(68, 0)">
    <!-- Primary Line: IPB INTERNATIONAL -->
    <text x="0" y="24" 
          fill="#FAF8F5" 
          font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
          font-size="17" 
          font-weight="600" 
          letter-spacing="0.16em">
      IPB INTERNATIONAL
    </text>

    <!-- Secondary Line: CONVENTION CENTER -->
    <text x="0" y="40" 
          fill="url(#goldLinear)" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="8.8" 
          font-weight="600" 
          letter-spacing="0.32em">
      CONVENTION CENTER
    </text>

    <!-- City / Location Indicator -->
    <circle cx="178" cy="37" r="1.5" fill="#C5A059" opacity="0.8"/>
    <text x="186" y="40" 
          fill="#DFC184" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="8.5" 
          font-weight="500" 
          letter-spacing="0.28em">
      BOGOR
    </text>
  </g>
</svg>
